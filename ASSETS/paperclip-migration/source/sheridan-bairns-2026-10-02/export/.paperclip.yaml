              title: "Authorization"
              rows:
                -
                  label: "Reason"
                  type: "key_value"
                  value: "allow_self"
        authorAgentSlug: "chief-of-staff"
        authorType: "agent"
        body: "Yes — one task needs your input: [SHE-2: MOSAIC knowledge base](/SHE/issues/SHE-2). Open it and answer the pending **Founder review: MOSAIC baseline v0.1** card. It has three questions covering the baseline, scoring/Analysis boundaries, and the synthetic teaching example. You can confirm or supply corrections.Read the [core reference](/SHE/issues/SHE-2#document-core-reference) and [learning guide](/SHE/issues/SHE-2#document-learning-guide); the [source register](/SHE/issues/SHE-2#document-source-register) provides supporting evidence. A source snapshot ZIP is also attached for reference.[SHE-3: Website clarity and comprehension test](/SHE/issues/SHE-3) is waiting for that baseline to be completed; nothing there needs approval yet. There are no pending hiring approvals, and the onboarding plan was already approved.Submitting the existing review card will bring The Oracle back to incorporate your answers. No need to create another task or manually mark SHE-2 done."
        createdAt: "2026-09-27T20:13:39.140Z"
