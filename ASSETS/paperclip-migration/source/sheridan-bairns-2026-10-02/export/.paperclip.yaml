agents:
  chief-of-staff:
    role: "general"
    adapter:
      config:
        dangerouslyBypassApprovalsAndSandbox: true
      type: "codex_local"
    runtime:
      aiConnection:
        method: "subscription"
        mode: "responsible_user"
        provider: "openai"
