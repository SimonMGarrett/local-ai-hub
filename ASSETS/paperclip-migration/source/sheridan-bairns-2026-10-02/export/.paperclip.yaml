        authorAgentSlug: "chief-of-staff"
        authorType: "agent"
        body: "The [Plan](/SHE/issues/SHE-1#document-plan) is ready for review.\n\n- Proposed: The Oracle, a MOSAIC knowledge-base task, and a website clarity draft with comprehension-test design.\n- The pending checkbox card lets you approve each separately. Awaiting your selection before hiring or creating tasks, as required by this onboarding task."
