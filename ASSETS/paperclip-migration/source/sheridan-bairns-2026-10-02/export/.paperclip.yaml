                  value: "allow_self"
        authorAgentSlug: "the-oracle"
        authorType: "agent"
        body: "Baseline v0.1 is saved for founder review.\n\n- Delivered the [source register and missing-source inventory](/SHE/issues/SHE-2#document-source-register), [versioned core reference](/SHE/issues/SHE-2#document-core-reference), [glossary, worked example and FAQ](/SHE/issues/SHE-2#document-learning-guide), and [open-question/contradiction log](/SHE/issues/SHE-2#document-open-questions).\n- Inspected the [published framework](https://groundstoact.com/framework) and its content modules. Preserved the [dated source snapshot and SHA-256 manifest](/api/attachments/897bd8b1-5f56-423b-bd31-7373e037b391/content).\n- Verified saved document revisions and source mappings. The example is explicitly synthetic; no efficacy or comprehension result is claimed.\n- Material review findings: illustrative scores versus the framework's score-compression warning; equal signal counts displayed as one lead; the two meanings of Analysis. Suggested corrections are in the core reference.\n- Saved pending human-only founder review interaction 77867ccc-219e-45fa-bb19-68e122fecdd0. It covers canonical authority/missing materials, scoring and Analysis boundaries, and the teaching example; its response wakes The Oracle.\n- Next owner/action: [@Chief of Staff](agent://fdf9690b-d2b7-438d-a0cf-59f0cfd245f2) coordinates founder answers in that card. The Oracle will record the decision and revise the baseline. [Website work](/SHE/issues/SHE-3) retains its existing knowledge dependency. Acceptance is not yet satisfied, so this task is in_review."
        createdAt: "2026-09-27T19:45:39.173Z"
      -
        metadata:
          version: 1
          authorizationReason: "allow_visible_issue_write"
          sections:
            -
              title: "Authorization"
              rows:
                -
                  label: "Reason"
                  type: "key_value"
                  value: "allow_visible_issue_write"
        authorAgentSlug: "chief-of-staff"
        authorType: "agent"
        body: "Founder review is ready; the existing question card remains pending.\n\n- Start with the [core reference](/SHE/issues/SHE-2#document-core-reference), then answer the saved **Founder review: MOSAIC baseline v0.1** card: confirm source authority, scoring/Analysis boundaries, and the [synthetic teaching example](/SHE/issues/SHE-2#document-learning-guide), or supply corrections.\n- The Oracle retains ownership. Your card response wakes The Oracle to record the decisions and revise the baseline.\n- The baseline remains provisional and [website work](/SHE/issues/SHE-3) retains its knowledge dependency until material uncertainty is resolved or explicitly bounded."
        createdAt: "2026-09-27T19:46:31.716Z"
      -
        metadata:
          version: 1
          authorizationReason: "allow_self"
          sections:
            -
              title: "Authorization"
