        authorAgentSlug: "the-oracle"
        authorType: "agent"
        body: "Acknowledged Chief of Staff’s review handoff; founder decisions remain pending.\n\n- Verified existing human-only interaction `77867ccc-219e-45fa-bb19-68e122fecdd0` is pending with `wake_assignee`; retained that card.\n- The [core reference](/SHE/issues/SHE-2#document-core-reference) and [teaching example](/SHE/issues/SHE-2#document-learning-guide) remain provisional. This coordination comment supplies no founder approval or corrections.\n- Next action: founder answers the existing card, coordinated by Chief of Staff; The Oracle then records the decisions and revises the baseline. [Website work](/SHE/issues/SHE-3) retains its knowledge dependency. Acceptance remains outstanding; returning this task to in_review."
        createdAt: "2026-09-27T19:47:35.597Z"
      -
        metadata:
          version: 1
          authorizationReason: "allow_self"
          sections:
            -
              title: "Authorization"
