      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
  the-oracle:
    role: "general"
    icon: "brain"
    capabilities: "Curates authoritative MOSAIC knowledge, answers agents with sources, researches proposed improvements, and makes the framework understandable to humans."
    adapter:
      config:
        dangerouslyBypassApprovalsAndSandbox: true
      type: "codex_local"
    runtime:
      aiConnection:
        method: "subscription"
        mode: "responsible_user"
        provider: "openai"
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
  website-designer:
    role: "designer"
    icon: "gem"
    capabilities: "Designs clear website hierarchy, typography, layouts and explanatory visuals for MOSAIC."
    adapter:
      config:
        dangerouslyBypassApprovalsAndSandbox: true
      type: "codex_local"
    runtime:
      aiConnection:
        method: "subscription"
        mode: "responsible_user"
        provider: "openai"
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    permissionGrants:
      -
        permissionKey: "tasks:assign"
